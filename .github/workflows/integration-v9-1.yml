name: Calori V9.1 Linux integration
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/integration-v9-1.yml'
      - 'scripts/integration/**'
      - 'tests/**'
      - 'src/**'
      - 'api/**'
      - 'server/**'
      - 'supabase/**'
      - 'package*.json'
      - '*config*'
permissions:
  contents: read
jobs:
  linux-integration:
    if: github.event.pull_request.number == 71
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.4.1'
      - name: Build official PostgreSQL 17.5 and verify PostgREST 16.5
        run: bash scripts/integration/install-linux-v9-1.sh "$RUNNER_TEMP/tools"
      - name: Combine exact PR70 with candidate PR71 in a disposable worktree
        run: node scripts/integration/prepare-v9-1.mjs "$RUNNER_TEMP/calori-integration-v91"
      - name: Install locked project dependencies
        working-directory: ${{ runner.temp }}/calori-integration-v91
        run: npm ci
      - name: Focused tests, complete Windows manifest and quality checks
        working-directory: ${{ runner.temp }}/calori-integration-v91
        env:
          COACH_TEST_POSTGRES_BIN: ${{ runner.temp }}/tools/pg17.5/bin
          SECURITY_TEST_POSTGREST_BIN: ${{ runner.temp }}/tools/postgrest/postgrest
        run: node scripts/integration/run-linux-v9-1.mjs
      - name: Preserve synthetic diagnostics and separate results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-integration-${{ matrix.repetition }}
          path: |
            ${{ runner.temp }}/calori-integration-v91/integration-results
            ${{ runner.temp }}/tools/provenance.sha256
            ${{ runner.temp }}/tools/postgres-build.log
          retention-days: 7
          if-no-files-found: error
