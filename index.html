<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/calori-logo-symbol.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calori — Nutrición y entrenamiento con IA</title>
    <meta name="description" content="Registrá comidas, entrenamientos y progreso con menos carga manual. Calori usa IA para ayudarte a estimar, organizar y entender tus hábitos." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="Calori — Nutrición y entrenamiento con IA" />
    <meta property="og:description" content="Registrá comidas, entrenamientos y progreso con menos carga manual. Calori te ayuda a estimar, organizar y entender tus hábitos." />
    <meta property="og:image" content="/brand/calori-logo-symbol.png" />
    <meta property="og:image:alt" content="Calori" />
    <script>
      (function() {
        try {
          var storedTheme = localStorage.getItem('calori-theme');
          if (storedTheme === 'dark' || (!storedTheme)) {
            document.documentElement.classList.add('dark');
          } else if (storedTheme === 'system') {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
